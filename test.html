<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid {
            background-color: red;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 10px;
        }
        .grid div {
            background-image: linear-gradient(45deg, white, black);
        }
        .row-one {
            background-color: blue;
        }
        .row-two {
            background-color: green;
        }
    </style>
</head>
<body>
    <section class="grid row-one">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </section>
    <section class="grid row-two">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </section>
    <section class="grid">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </section>
    <section class="grid">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </section>

</body>
</html>
